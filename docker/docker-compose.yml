version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    environment:
      - AIPROF_ENV=development
      - AIPROF_LRS_ENDPOINT=http://learning-locker:8080/data/xAPI/statements
      - AIPROF_LRS_KEY=${AIPROF_LRS_KEY:-changeme}
      - AIPROF_LRS_SECRET=${AIPROF_LRS_SECRET:-changeme}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ..:/app
    working_dir: /app
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - redis
      - learning-locker

  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:6-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  learning-locker:
    image: learninglocker/learninglocker:latest
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/learninglocker
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      - mongo
      - redis

volumes:
  mongo_data:
  redis_data:
